<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>メロボタンオーバーレイ</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
body{
    margin:0;
    padding:30px;
    background:#f2d7e6;
    color:#555;
    font-family:sans-serif;
}

.overlayWrap{
    width:700px;
    margin:0 auto;
}

.totalBox{
    text-align:center;
    margin-bottom:30px;
}

.totalLabel{
    font-size:28px;
}

#totalCount{
    font-size:80px;
    font-weight:bold;
}

.playerRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 0;
    font-size:36px;
}

.playerName{
    font-weight:bold;
}

.playerTotal{
    font-size:46px;
    font-weight:bold;
}

/* OBSで上書きしやすい共通クラス */
.obsText{
    color:#555;
}

#enableSoundButton{
    margin-top:30px;
    font-size:18px;
    padding:10px 18px;
}
</style>
</head>

<body>

<div class="overlayWrap">

    <div class="totalBox obsText">
        <div class="totalLabel">合算</div>
        <div id="totalCount">0</div>
    </div>

    <div class="playerRow obsText">
<span class="playerName" id="player1Name">参加者1</span>
        <span class="playerTotal" id="player1Total">0</span>
    </div>

    <div class="playerRow obsText">
<span class="playerName" id="player2Name">参加者2</span>
        <span class="playerTotal" id="player2Total">0</span>
    </div>

    <div class="playerRow obsText">
<span class="playerName" id="player3Name">参加者3</span>
        <span class="playerTotal" id="player3Total">0</span>
    </div>

    <div class="playerRow obsText">
<span class="playerName" id="player4Name">参加者4</span>
        <span class="playerTotal" id="player4Total">0</span>
    </div>

    <button id="enableSoundButton" onclick="enableSounds()">
        🌹 音声を有効化
    </button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    onChildAdded,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBL-VOrxHb9peeM94B2mVHlj1u7tmMGafw",
  authDomain: "oogiri-system.firebaseapp.com",
  databaseURL:"https://oogiri-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "oogiri-system",
  storageBucket: "oogiri-system.firebasestorage.app",
  messagingSenderId: "96017540049",
  appId: "1:96017540049:web:0befbba9f7810a725436f0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// ==============================
// 合算表示
// ==============================

let currentJudge1 = 0;
let currentJudge2 = 0;
let limitEnabled = true;

function updateTotal(){

    const total = limitEnabled
        ? Math.min(currentJudge1,20) + Math.min(currentJudge2,20)
        : currentJudge1 + currentJudge2;

    document.getElementById("totalCount").innerText = total;
}

onValue(ref(db, "heSystem/current"), (snapshot)=>{

    const data = snapshot.val() || {};

    currentJudge1 = data.judge1 || 0;
    currentJudge2 = data.judge2 || 0;

    updateTotal();
});

onValue(ref(db, "heSystem/settings/limitEnabled"), (snapshot)=>{

    const value = snapshot.val();

    if(value !== null){
        limitEnabled = value;
    }

    updateTotal();
});


// ==============================
// 参加者累計
// ==============================

onValue(ref(db, "heSystem/participants"), (snapshot)=>{

    const data = snapshot.val() || {};

    // 累計
    document.getElementById("player1Total").innerText =
        data.player1?.total || 0;

    document.getElementById("player2Total").innerText =
        data.player2?.total || 0;

    document.getElementById("player3Total").innerText =
        data.player3?.total || 0;

    document.getElementById("player4Total").innerText =
        data.player4?.total || 0;

    // 名前
document.getElementById("player1Name").innerText =
    data.player1?.name || "参加者1";

document.getElementById("player2Name").innerText =
    data.player2?.name || "参加者2";

document.getElementById("player3Name").innerText =
    data.player3?.name || "参加者3";

document.getElementById("player4Name").innerText =
    data.player4?.name || "参加者4";
});

// ==============================
// SE
// ==============================

const judge1Sound = new Audio("judge1.mp3");
const judge2Sound = new Audio("judge2.mp3");
const addTotalSound = new Audio("addtotal.mp3");

judge1Sound.preload = "auto";
judge2Sound.preload = "auto";
addTotalSound.preload = "auto";

let soundEnabled = false;

window.enableSounds = async function(){

    try{

        judge1Sound.volume = 0;
        judge2Sound.volume = 0;
	addTotalSound.volume = 0;

        await judge1Sound.play();
        judge1Sound.pause();
        judge1Sound.currentTime = 0;

        await judge2Sound.play();
        judge2Sound.pause();
        judge2Sound.currentTime = 0;

	await addTotalSound.play();
	addTotalSound.pause();
	addTotalSound.currentTime = 0;

        judge1Sound.volume = 1;
        judge2Sound.volume = 1;
	addTotalSound.volume = 1;

        soundEnabled = true;

        document.getElementById("enableSoundButton").innerText =
            "☺️ 音声ON";

    }catch(error){
        console.error("音声有効化エラー:", error);
    }
};


const eventsRef = ref(db, "heSystem/events");
const existingEventKeys = new Set();

get(eventsRef).then((snapshot)=>{

    snapshot.forEach((child)=>{
        existingEventKeys.add(child.key);
    });

    onChildAdded(eventsRef, (snapshot)=>{

        if(existingEventKeys.has(snapshot.key)){
            return;
        }

if(event.type === "addTotal"){
    addTotalSound.currentTime = 0;
    addTotalSound.play().catch(error=>{
        console.error("加算SE再生失敗:", error);
    });
}

        const event = snapshot.val();

// if(!soundEnabled){
//     return;
// }

if(event.judge === "judge1"){
    judge1Sound.currentTime = 0;
    judge1Sound.play().catch(error=>{
        console.error("judge1 SE再生失敗:", error);
    });
}

if(event.judge === "judge2"){
    judge2Sound.currentTime = 0;
    judge2Sound.play().catch(error=>{
        console.error("judge2 SE再生失敗:", error);
    });
}

if(event.type === "addTotal"){
    addTotalSound.currentTime = 0;
    addTotalSound.play().catch(error=>{
        console.error("加算SE再生失敗:", error);
    });
}

    });

});

</script>

</body>
</html>
